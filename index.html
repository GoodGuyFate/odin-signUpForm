<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-image-container">
      <div class="background-block">
        <img
          src="/images/odin-lined.png"
          alt="The odin viking"
          class="viking"
        />
        <p>Odin</p>
      </div>
      <img
        src="/images/leaves.jpg"
        alt="A close up of some ferns"
        class="fern-image"
      />
      <p class="footer">
        Photo by
        <a href="https://unsplash.com/@haliewestphoto" target="_blank"
          >Halie West</a
        >
        on
        <a
          href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
          target="_blank"
          >Unslplash</a
        >
      </p>
    </div>
    <div class="form-wrapper">
      <p class="header">
        This is not a real online service! You know you need something like this
        in your life to help you realize your deepest dreams.
        <span class="cta">Sign up <em>now</em> to get started.</span>
        <span class="sp2">You <em>know</em> you want to. </span>
      </p>
      <div class="form-container">
        <form action="https://httpbin.com/get" method="get">
            
        </form>
      </div>
    </div>
  </body>
</html>
