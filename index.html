<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-image-container">
      <div class="background-block">
        <img
          src="/images/odin-lined.png"
          alt="The odin viking"
          class="viking"
        />
        <p>Odin</p>
      </div>
      <img
        src="/images/leaves.jpg"
        alt="A close up of some ferns"
        class="fern-image"
      />
      <p class="footer">
        Photo by
        <a href="https://unsplash.com/@haliewestphoto" target="_blank"
          >Halie West</a
        >
        on
        <a
          href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
          target="_blank"
          >Unslplash</a
        >
      </p>
    </div>
    <div class="form-wrapper">
      <p class="header">
        This is not a real online service! You know you need something like this
        in your life to help you realize your deepest dreams.
        <span class="cta">Sign up <em>now</em> to get started.</span>
        <span class="sp2">You <em>know</em> you want to. </span>
      </p>
      <div class="form-container">
        <form action="https://httpbin.org/get" method="get" id="create-account">
          <div class="header-container">
            <h1>Let's do this!</h1>
            <p>* Indicates required field</p>
          </div>
          <div class="form-elements-row-1-container">
            <div class="first-name">
              <label for="first-name">FIRST NAME*</label>
              <input type="text" id="first-name" name="first-name" required />
            </div>
            <div class="last-name">
              <label for="last-name">LAST NAME</label>
              <input type="text" id="last-name" name="last-name" />
            </div>
          </div>
          <div class="form-elements-row-2-container">
            <div class="email">
              <label for="email">EMAIL*</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                title="example@email.com"
                placeholder="example@email.com"
              />
            </div>
            <div class="phone-number">
              <label for="phone-number">PHONE NUMBER</label>
              <input type="tel" id="phone-number" name="phone-number" />
            </div>
          </div>
          <div class="form-elements-row-3-container">
            <div class="password">
              <label for="first-name">PASSWORD*</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
                title="Must be at least 8 characters long and contain at least one letter and one number."
              />
            </div>
            <div class="password-confirm">
              <label for="password-confirm">CONFIRM PASSWORD*</label>
              <input
                type="password"
                id="password-confirm"
                name="password-confirm"
                required
                pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
                title="Must be at least 8 characters long and contain at least one letter and one number."
              />
            </div>
          </div>
        </form>
      </div>
      <div class="button-container">
        <button type="submit" form="create-account">Create Account</button>
      </div>
      <div class="login-container">
        <p>Already have an account? <a href="">Log in</a></p>
      </div>
    </div>
  </body>
</html>
