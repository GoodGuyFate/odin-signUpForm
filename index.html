<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>

  <body>

        Photo by
        <a href="https://unsplash.com/@haliewestphoto" target="_blank">Halie West</a> on

          >Unslplash</a
        >
      </p>

    <div class="form-wrapper">
      <form action="https://httpbin.com/get" method="get">
        <h1>Test</h1>
      </form>
    </div>
